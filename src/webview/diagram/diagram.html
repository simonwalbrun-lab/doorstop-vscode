<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} https://unpkg.com; script-src 'nonce-{{nonce}}' https://unpkg.com;">
  <link href="{{styleUri}}" rel="stylesheet">
  <link href="https://unpkg.com/vis-network@10.1.2/styles/vis-network.min.css" rel="stylesheet">
  <title>Doorstop Graph</title>
</head>
<body>
  <div id="drop-hint">Ziehe Requirements aus der TreeView oder dem Editor hierher</div>
  <div id="mynetwork"></div>

  <div id="toolbar">
    <button id="layout-toggle" type="button">Hierarchical Layout</button>
  </div>

  <div id="legend">
    <div id="legend-toggle">Legend ▾</div>
    <div id="legend-body">
      <div class="legend-section">
        <strong>Status</strong>
        <div>✅ Reviewed &nbsp; ❓ Not reviewed</div>
        <div>⚠️ Suspect link</div>
        <div>🔹 Derived</div>
        <div>🚫 Inactive &nbsp; 📄 Non-normative</div>
      </div>
      <div class="legend-section">
        <strong>Documents</strong>
        <div id="legend-documents"></div>
      </div>
    </div>
  </div>

  <script nonce="{{nonce}}" src="https://unpkg.com/vis-network@10.1.2/standalone/umd/vis-network.min.js"></script>
  <script nonce="{{nonce}}" src="{{stateJsUri}}"></script>
  <script nonce="{{nonce}}" src="{{renderJsUri}}"></script>
  <script nonce="{{nonce}}" src="{{interactionsJsUri}}"></script>
  <script nonce="{{nonce}}" src="{{messagingJsUri}}"></script>
  <script nonce="{{nonce}}" src="{{mainJsUri}}"></script>
</body>
</html>
