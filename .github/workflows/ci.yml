name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npx --yes @vscode/vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"

  extension-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # server/ is a submodule; the tests need its source, not just the pointer.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The server from this commit, not the last PyPI release: the extension
      # tests exercise endpoints that ship together with the extension code.
      - run: pip install -e "./server[dev]"
      - run: npm ci
      - run: xvfb-run -a npm test

  # PDF export end to end (spec 027/028): Doorstop HTML publish -> in-repo export
  # script -> PDFs. Chromium is downloaded here, during setup, not by the test.
  pdf-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The server package brings Doorstop and the spec 028 publish command.
      - run: pip install ./server
      - name: Install PDF tooling
        working-directory: media/pdf-export
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: node --test src/test/pdf/exportPdf.test.mjs

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./server[dev]"
      - run: pytest server/tests
